<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1060" id="factory-map" viewBox="0 0 680 1060" role="img" aria-labelledby="map-title map-desc"><title id="map-title">Robot3 공정 이동 시뮬레이션</title><desc id="map-desc">사용자가 지정한 방향으로 왼쪽 아래 초기위치, 중앙 위 자재창고, 오른쪽 아래 제작공정을 배치했습니다. 중앙 통로와 아래쪽 대기장소가 연결됩니다. 치수와 이동 시간은 설명용입니다.</desc><style>svg{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#21323d}.metrics article>div:not(.small-progress){display:flex;align-items:baseline;gap:7px;margin-top:9px}.small-progress{height:3px;background:#e0ebe4;margin-top:17px;border-radius:5px;overflow:hidden}.small-progress i{display:block;width:0%;height:100%;background:#568c72;transition:width .3s}.road-dash{fill:none;stroke:#bccbd3;stroke-width:1.5;stroke-dasharray:6 8}.zone-title{font-size:14px;font-weight:700;fill:#334b59}.zone-title.small{font-size:12px}.zone-sub{font-size:8px;letter-spacing:.5px;fill:#899ba6}.dock-label{font-size:8px;fill:#9aa8b1}.robot-label{font-size:11px;font-weight:700;paint-order:stroke;stroke:#f8fafb;stroke-width:4px}.route-label{font-size:10px;fill:#a0afb8;letter-spacing:1px}.station{cursor:pointer}.active-arm use{filter:drop-shadow(0 0 5px #6da695)}.host-console .small-progress{margin-top:18px}
#factory-map .zone-title{font-size:19px}
#factory-map .zone-title.small{font-size:17px}
#factory-map .zone-sub,#factory-map .dock-label{font-size:14px;letter-spacing:0;fill:#667983}
#factory-map .route-label{font-size:17px;fill:#81939a}
#factory-map .robot-label{font-size:16px}
#factory-map .road-dash{stroke:#9cabb0;stroke-width:2;stroke-dasharray:5 12}

.dock-cue{pointer-events:none}.robot-body{transform-box:view-box}</style><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".75" fill="#d4dde2"></circle></pattern><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".12"></feDropShadow></filter><g id="robot-shape"><rect x="-23" y="-16" width="7" height="30" rx="3" fill="#273a47"></rect><rect x="16" y="-16" width="7" height="30" rx="3" fill="#273a47"></rect><rect x="-18" y="-22" width="36" height="42" rx="9" fill="white" stroke="currentColor" stroke-width="3"></rect><rect x="-12" y="-15" width="24" height="23" rx="3" fill="currentColor" opacity=".12"></rect><circle cy="-8" r="6" fill="#273a47"></circle><path d="M-9 -27 L0 -43 L9 -27" fill="currentColor"></path></g><g id="arm-shape"><rect x="-17" y="-8" width="34" height="16" rx="5" fill="#31444e"></rect><path d="M0 0 L-19 -24 L2 -43 L24 -39" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="-19" cy="-24" r="5" fill="#263b46"></circle><circle cx="2" cy="-43" r="4" fill="#263b46"></circle><path d="M24 -44 v12 m0 -12 h8 m-8 12 h8" fill="none" stroke="#263b46" stroke-width="3"></path></g></defs>
<rect width="680" height="1060" fill="#f1f3f2"></rect>
<rect x="20" y="20" width="640" height="1020" rx="8" fill="url(#grid)" stroke="#d6dddf"></rect>
<!-- Photo topology, oriented as specified: storage above, home bottom-left,
     production bottom-right, waiting bay off the central junction. -->
