<g id="dock-cues" aria-label="대기장소를 제외한 ArUco 표식과 목표 위치별 후방 적외선 센서 검은 감지선"><g class="dock-cue" transform="translate(110 700) rotate(270)"><title>home1: ArUco 위치 표식과 후방 적외선 센서용 검은 정지선 (개념 표시)</title><path d="M-29 21 H29" stroke="#111" stroke-width="6"></path><g transform="translate(0 -55) rotate(-270)"><rect x="-14" y="-14" width="28" height="28" fill="white" stroke="#111" stroke-width="3"></rect><text y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#111">AR</text></g></g><g class="dock-cue" transform="translate(110 795) rotate(270)"><title>home2: ArUco 위치 표식과 후방 적외선 센서용 검은 정지선 (개념 표시)</title><path d="M-29 21 H29" stroke="#111" stroke-width="6"></path><g transform="translate(0 -55) rotate(-270)"><rect x="-14" y="-14" width="28" height="28" fill="white" stroke="#111" stroke-width="3"></rect><text y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#111">AR</text></g></g><g class="dock-cue" transform="translate(340 920) rotate(0)"><title>대기장소: ArUco 마커 없음 · 후방 IR 센서용 검은 정지선</title><path d="M-29 21 H29" stroke="#111" stroke-width="6"></path></g><g class="dock-cue" transform="translate(340 300) rotate(0)"><title>warehouse: ArUco 위치 표식과 후방 적외선 센서용 검은 정지선 (개념 표시)</title><path d="M-29 21 H29" stroke="#111" stroke-width="6"></path><g transform="translate(0 -55) rotate(0)"><rect x="-14" y="-14" width="28" height="28" fill="white" stroke="#111" stroke-width="3"></rect><text y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#111">AR</text></g></g><g class="dock-cue" transform="translate(400 750) rotate(90)"><title>assembly: ArUco 위치 표식과 후방 적외선 센서용 검은 정지선 (개념 표시)</title><path d="M-29 21 H29" stroke="#111" stroke-width="6"></path><g transform="translate(0 -55) rotate(-90)"><rect x="-14" y="-14" width="28" height="28" fill="white" stroke="#111" stroke-width="3"></rect><text y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#111">AR</text></g></g></g>
